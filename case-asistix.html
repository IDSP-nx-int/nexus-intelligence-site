<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASISTIX Case Study · Nexus Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ASISTIX case study: attendance & justification management using Microsoft 365, Power Automate, SharePoint, and Power BI." />

  <style>
    :root{
      --accent: #09be7a;   /* Nexus green */
      --text: #222222;
      --muted: #555;
      --bg: #ffffff;
      --soft: #f5f5f5;
      --border: #e0e0e0;
      --max: 1100px;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.5;
    }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    header{
      position: sticky;
      top:0;
      z-index: 10;
      background:#ffffffcc;
      backdrop-filter: blur(8px);
      border-bottom:1px solid var(--border);
    }
    .nav{
      max-width: var(--max);
      margin:0 auto;
      padding:0.6rem 1.5rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
    }
    .nav-left{
      display:flex;
      align-items:center;
      gap:0.8rem;
      flex-wrap: wrap;
    }
    .brand{
      font-weight:800;
      color:#111;
      white-space:nowrap;
    }
    .nav-links{
      display:flex;
      gap:0.8rem;
      flex-wrap: wrap;
      font-size:0.9rem;
    }
    .nav-links a{
      padding:0.25rem 0.4rem;
      border-radius:999px;
      font-weight:600;
    }
    .nav-links a:hover{
      background: var(--soft);
      text-decoration:none;
    }

    main{
      max-width: var(--max);
      margin:0 auto;
      padding:1.5rem 1rem 3rem;
    }

    .hero{
      display:grid;
      grid-template-columns: minmax(0,2.2fr) minmax(0,1.8fr);
      gap:2rem;
      align-items:start;
      padding:2rem 1.5rem;
      margin: 1rem 0 1.5rem;
      border:1px solid var(--border);
      border-radius:14px;
      background: linear-gradient(135deg, #e6f9f2, #ffffff);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:0.5rem;
      padding:0.25rem 0.7rem;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      font-size:0.85rem;
      font-weight:600;
      color:#0b6b4b;
      margin-bottom:0.75rem;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: var(--accent);
    }
    h1,h2,h3{ margin:0 0 0.6rem; color:#111; }
    h1{ font-size: clamp(1.9rem, 3vw, 2.6rem); }
    h2{ font-size: clamp(1.3rem, 2.1vw, 1.8rem); margin-top:1.8rem; }
    p{ margin:0 0 0.8rem; }
    .muted{ color: var(--muted); }
    .hero-ctas{
      display:flex;
      gap:0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0.45rem;
      border-radius:999px;
      padding:0.5rem 1.1rem;
      font-size:0.9rem;
      border:1px solid transparent;
      cursor:pointer;
      text-decoration:none;
      white-space: nowrap;
    }
    .btn-primary{
      background: var(--accent);
      color:#fff;
      border-color: var(--accent);
    }
    .btn-primary:hover{
